name: Compatibility

on:
  push:
  pull_request:

# Nothing here writes to the repository; CodeQL flags a workflow that does not
# say so, since the default token is broader than the job needs.
permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    runs-on: ubuntu-latest

    # Does the library build and pass its suite across the supported range?
    # Formatting, credo, dialyzer and coverage are enforced once, in quality.yml.
    strategy:
      fail-fast: false
      matrix:
        # The floor is Elixir 1.15: req, plug, finch, mint and ex_doc all
        # require it. Only pairs the two projects actually support are listed,
        # so no exclusions are needed.
        include:
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mix-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Compile & error on warning
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
