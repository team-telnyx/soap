name: Compatibility

on:
  push:
  pull_request:

env:
  MIX_ENV: test

jobs:
  build:
    runs-on: ubuntu-latest

    # Does the library build and pass its suite across the supported range?
    # Formatting, credo, dialyzer and coverage are enforced once, in quality.yml.
    strategy:
      fail-fast: false
      matrix:
        # The floor is Elixir 1.15: req, plug, finch, mint and ex_doc all
        # require it. Only pairs the two projects actually support are listed,
        # so no exclusions are needed.
        include:
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"

    steps:
      - uses: actions/checkout@v4

      - name: Setup elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        id: mix-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Compile & error on warning
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
