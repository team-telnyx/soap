name: Quality

on:
  push:
  pull_request:

# Nothing here writes to the repository; CodeQL flags a workflow that does not
# say so, since the default token is broader than the job needs.
permissions:
  contents: read

env:
  MIX_ENV: test
  # The version the chain is enforced on. Compatibility across the supported
  # range is the matrix in elixir.yml; this job is about the code itself.
  ELIXIR_VERSION: "1.17"
  OTP_VERSION: "26"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mix-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-

      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run credo
        run: mix credo --strict --all

      # Keyed on mix.exs as well as mix.lock: dialyzer configuration lives
      # there, and a PLT built before a change to it is the wrong PLT.
      - name: Retrieve PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: plt-cache
        with:
          path: .plts
          key: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-plts-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-plts-

      - name: Create PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: |
          mix dialyzer --plt

      - name: Run dialyzer
        run: mix dialyzer --no-check --halt-exit-status

      # Fails on a failing test and, through minimum_coverage in
      # coveralls.json, on coverage below 90%.
      - name: Run tests with coverage
        run: mix test --cover
